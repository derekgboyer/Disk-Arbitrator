name: macOS build

on:
  push:
  pull_request:

jobs:
  universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build Release universal
        run: |
          xcodebuild \
            -project DiskArbitrator.xcodeproj \
            -scheme DiskArbitrator \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/disk-arbitrator" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify architectures and layout
        run: |
          APP="${RUNNER_TEMP}/disk-arbitrator/Build/Products/Release/Disk Arbitrator.app"
          BINARY="${APP}/Contents/MacOS/Disk Arbitrator"
          test -d "${APP}"
          lipo -info "${BINARY}"
          lipo -info "${BINARY}" | grep -q arm64
          lipo -info "${BINARY}" | grep -q x86_64
          test -f "${APP}/Contents/Library/LaunchAgents/us.burghardt.Disk-Arbitrator.plist"
          test -f "${APP}/Contents/Resources/PrivacyInfo.xcprivacy"
          plutil -lint "${APP}/Contents/Info.plist"
          plutil -lint "${APP}/Contents/Library/LaunchAgents/us.burghardt.Disk-Arbitrator.plist"
          # Hardened runtime is recorded as the runtime codesign flag (0x10000).
          codesign -d --verbose=2 "${APP}" 2>&1 | grep -q "runtime"
